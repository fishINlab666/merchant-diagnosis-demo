name: Deploy main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Skill dependencies
        run: python -m pip install -r .agents/skills/merchant-diagnosis/requirements.txt

      - name: Test Skill
        run: python -m unittest discover -s .agents/skills/merchant-diagnosis/tests -q

      - name: Test delivery tools
        run: python -m unittest discover -s tools/tests -q

      - name: Build static showcase
        run: python scripts/build-showcase.py

      - name: Publish main site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
