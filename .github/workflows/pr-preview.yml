name: Deploy PR previews

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Skill dependencies
        if: github.event.action != 'closed'
        run: python -m pip install -r .agents/skills/merchant-diagnosis/requirements.txt

      - name: Test Skill and build static preview
        if: github.event.action != 'closed'
        run: |
          python -m unittest discover -s .agents/skills/merchant-diagnosis/tests -q
          python scripts/build-showcase.py

      - name: Publish or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
