/* Explanation is an optional reading layer over the business decisions. */
.toolbar{gap:20px}.toolbar nav{gap:18px}.tools{margin-left:auto}
.view-mode{display:flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:#edf2eb;white-space:nowrap}
.view-mode button{border:0;background:transparent;min-height:36px;padding:6px 12px;color:var(--muted);font-weight:500}
.view-mode button[aria-pressed="true"]{background:var(--deep);color:white;font-weight:650}
.view-mode button:not([aria-pressed="true"]):hover{background:#dce7d8;color:var(--ink)}
.explanation-guide{margin-top:21px;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.explanation-guide>p{font-size:13px;font-weight:650}.explanation-guide>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.explanation-jump{min-height:36px;font-weight:500;background:transparent}
.method-callout{grid-column:1/-1;margin-top:16px;min-width:0}
.finding>.method-callout{margin-top:-8px}.method-marker{display:inline-flex;align-items:center;gap:7px;min-height:40px;text-align:left;background:#fff4dc;border:1px solid #c8a461;color:#644917;line-height:1.5;max-width:100%}
.method-marker:hover,.method-marker[aria-expanded="true"]{background:#f3e0b8;color:#533a0f}.method-marker svg{flex-shrink:0}
.method-detail{margin-top:12px;padding:20px;background:#fffdf7;border:1px solid #d9c79f;border-radius:12px;color:var(--ink);min-width:0}
.method-detail-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.method-detail h4{font-size:15px;font-weight:650;margin:0;line-height:1.6}.method-close{min-height:34px;padding:4px 10px;background:transparent;flex-shrink:0}
.method-detail .method-explanation,.method-record .method-explanation{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px 18px;margin:0;font-size:12px;line-height:1.85}
.method-explanation dt{color:var(--muted);margin:0;font-size:12px}.method-explanation dd{max-width:75ch}
.method-records{border-top:1px solid var(--line)}.method-record{border-bottom:1px solid var(--line)}
.method-record>summary{display:flex;justify-content:space-between;align-items:center;gap:20px;cursor:pointer;padding:19px 2px;font-size:14px;list-style:none}
.method-record>summary::-webkit-details-marker{display:none}.method-record>summary strong{font-weight:650}.method-record>summary strong::after{content:'';display:inline-block;width:6px;height:6px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:0 0 3px 13px}
.method-record[open]>summary strong::after{transform:rotate(225deg);margin-bottom:0}.method-status{font-size:12px;font-weight:400;color:var(--muted);text-align:right}.method-status.used{color:var(--green)}
.method-record>.method-explanation{padding:2px 2px 22px;max-width:900px}
.audience-columns,.audience-select{display:grid;grid-template-columns:.85fr 1fr 1fr 1.5fr;gap:24px}
.audience-columns{padding:0 20px 10px;font-size:11px;color:var(--muted)}
.audience-options{border-top:1px solid var(--line)}.audience-option{border-bottom:1px solid var(--line);min-width:0}
.audience-select{width:100%;border:0;border-radius:0;background:transparent;min-height:86px;padding:18px 20px;text-align:left;align-items:start;font-size:13px;font-weight:400;line-height:1.8}
.audience-select>span{min-width:0;overflow-wrap:anywhere}.audience-select>span:first-child{font-weight:650}
.audience-select[aria-pressed="true"]{background:var(--soft)}.audience-select:hover{background:#e0eadc}
.audience-detail{padding:17px 20px 20px;background:#f9fbf6}.audience-detail dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:9px 20px;margin:0;font-size:12px;line-height:1.85}
.audience-detail dt{color:var(--muted)}.audience-detail dd{max-width:75ch}
.audience-option>.method-callout{margin:12px 20px 18px}
@media(max-width:1180px){.toolbar nav{display:none}.view-mode{margin-left:auto}.tools{margin-left:0}}
@media(max-width:740px){
  html{scroll-padding-top:135px}.toolbar{flex-wrap:wrap;gap:10px}.toolbar .tools{margin-left:auto}
  .view-mode{order:3;flex:1 0 100%;margin:0}.view-mode button{flex:1}.tools button{min-height:36px}
  .explanation-guide{margin-top:18px}.explanation-jump{font-size:11px;padding:7px 10px}
  .method-detail{padding:17px}.method-detail .method-explanation,.method-record .method-explanation{grid-template-columns:66px minmax(0,1fr);gap:10px 12px;font-size:12px}
  .method-record>summary{align-items:flex-start;gap:12px;font-size:13px}.method-status{font-size:11px;max-width:9em;flex-shrink:0}
  .audience-columns{display:none}.audience-select{grid-template-columns:1fr;gap:6px;padding:17px 15px;font-size:12px;min-height:0}
  .audience-select>span{display:grid;grid-template-columns:66px minmax(0,1fr);gap:10px}.audience-select>span::before{content:attr(data-label);font-weight:400;color:var(--muted);font-size:11px}
  .audience-select>span:first-child{font-size:14px}.audience-detail{padding:15px}.audience-detail dl{grid-template-columns:66px minmax(0,1fr);gap:8px 10px;font-size:12px}
  .audience-option>.method-callout{margin:12px 15px 16px}
}
@media print{
  .explain-only{display:none!important}.audience-option{break-inside:avoid}.audience-select{min-height:0;font-size:10px;padding:10px 12px;background:transparent!important}
  .audience-detail,.audience-detail[hidden]{display:block!important;background:transparent;padding:0 12px 12px}.audience-detail dl{font-size:9px;gap:4px 12px}.audience-columns{font-size:9px;padding:0 12px 6px}
}
</style>

<body>
  <a class="skip" href="#main">跳到方案</a>
  <header class="toolbar">
    <a class="brand" href="#main">经营行动方案</a>
    <nav aria-label="方案导航"><a href="#decision">先看结论</a><a href="#dashboard">看清依据</a><a href="#execution">开始行动</a></nav>
    <div id="view-mode" class="view-mode" role="group" aria-label="展示方式" hidden><button id="mode-boss" type="button" aria-pressed="true">老板看板</button><button id="mode-product" type="button" aria-pressed="false">产品讲解</button></div>
    <div class="tools"><button id="copy" type="button">复制摘要</button><button id="print" type="button">打印 / PDF</button></div>
  </header>
  <main id="main">
    <section id="decision" aria-labelledby="headline">
      <div class="merchant-row"><p id="merchant"></p><span id="synthetic" hidden>合成数据演示</span></div>
      <h1 id="headline"></h1>
      <p id="scope" class="scope"></p>
      <div id="explanation-guide" class="explanation-guide explain-only" hidden><p>查看经营判断背后的方法</p><div id="explanation-links" aria-label="方法讲解入口"></div></div>
      <div class="decision-grid">
        <div class="money-panel"><h2 id="money-label"></h2><p class="money-amount"><strong id="money-value"></strong><span id="money-unit"></span></p><p id="money-period" class="money-period"></p><p id="money-note" class="money-note"></p><details id="money-basis"><summary>怎么算的</summary><p></p></details></div>
        <div class="first-action"><h2>先做这一件事</h2><p id="first-action-title"></p><dl id="first-action-meta"></dl><a class="action-link" href="#execution">查看执行安排 <span aria-hidden="true">→</span></a></div>
      </div>
    </section>
    <section id="dashboard" aria-labelledby="dashboard-title"><div class="section-heading"><h2 id="dashboard-title">为什么值得做</h2><p>把钱花在哪、收益怎么来，一起看清</p></div><div id="charts" class="charts"></div><div id="findings" class="findings"></div></section>
    <section id="audience" aria-labelledby="audience-title" hidden><div class="section-heading"><h2 id="audience-title">把商品和权益给对人</h2><p>选择人群，查看判断依据与验收方式</p></div><div class="audience-columns" aria-hidden="true"><span>人群</span><span>匹配商品</span><span>给什么权益</span><span>本次决策</span></div><div id="audience-options" class="audience-options"></div></section>
    <section id="execution" aria-labelledby="execution-title"><div class="section-heading"><h2 id="execution-title">接下来怎么做</h2><p>从试行到复盘，逐项推进</p></div><div id="actions" class="actions"></div><div id="gaps" class="gaps"></div><div id="followup" class="followup"><h3>到时看结果，再决定下一步</h3><dl></dl></div></section>
    <section id="methods" class="explain-only" aria-labelledby="methods-title" hidden><div class="section-heading"><h2 id="methods-title">这次怎样使用经营方法</h2><p>每项方法都说明适用情况与材料依据</p></div><div id="method-records" class="method-records"></div></section>
    <footer><span id="footer-merchant"></span><a href="#decision">回到结论 ↑</a></footer>

      addDefinition(list, row.economics.label, amount);
    }
    detail.append(list); wrapper.append(button, detail); $('audience-options').append(wrapper);
    register('audience_plan', index, wrapper); audienceRows.push({button, detail});
    button.addEventListener('click', () => {
      audienceRows.forEach(entry => {
        const selected = entry.button === button;
        entry.button.setAttribute('aria-pressed', String(selected));
        entry.button.setAttribute('aria-expanded', String(selected));
        entry.detail.hidden = !selected;
      });
    });
  });
  $('gaps').hidden = !data.gaps.length;
  if (data.gaps.length) { $('gaps').append(el('h3', '还需要确认什么')); data.gaps.forEach(gap => { const row = el('div', null, 'gap'); row.append(el('strong', gap.item), el('p', gap.why)); $('gaps').append(row); }); }
  const follow = $('followup').querySelector('dl');
  addDefinition(follow, '复盘时间', data.followup.when);
  addDefinition(follow, '需要回传', data.followup.collect.length ? data.followup.collect.join('；') : '按行动安排记录实际执行情况');
  addDefinition(follow, '再做决定', data.followup.decision);
  $('footer-merchant').textContent = data.merchant.name + ' · 经营行动方案';
  const methods = data.methods || [];
  const annotations = [];
  let currentAnnotation = null;
  function explanationContent(method) {
    const list = el('dl', null, 'method-explanation');
    if (method.basis) addDefinition(list, '材料依据', method.basis);
    addDefinition(list, '方法来源', method.origin);
    addDefinition(list, '本次判断', method.decision);
    addDefinition(list, '适配理由', method.reason);
    const actionIndexes = [...new Set(method.anchors.filter(anchor => anchor.section === 'actions').map(anchor => anchor.index))];
    if (actionIndexes.length) addDefinition(list, '对应执行', actionIndexes.map(index => {
      const action = data.actions[index]; return action.title + '（' + action.owner + ' · ' + action.timing + '）';
    }).join('；'));
    return list;
  }
  function closeAnnotation(returnFocus = false) {
    if (!currentAnnotation) return;
    const active = currentAnnotation;
    active.panel.hidden = true; active.button.setAttribute('aria-expanded', 'false');
    currentAnnotation = null;
    if (returnFocus) active.button.focus();
  }
  function openAnnotation(annotation) {
    if (currentAnnotation === annotation) { closeAnnotation(); return; }
    closeAnnotation(); annotation.panel.hidden = false; annotation.button.setAttribute('aria-expanded', 'true');
    currentAnnotation = annotation;
  }
  function annotationIcon() {
    const icon = svgEl('svg', {viewBox: '0 0 20 20', width: 20, height: 20, 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5});
    icon.append(svgEl('circle', {cx: 10, cy: 10, r: 7}), svgEl('path', {d: 'M10 7v6M7 10h6'}));
    return icon;
  }
  methods.forEach((method, index) => {
    const record = el('details', null, 'method-record');
    const summary = el('summary'); summary.append(el('strong', method.name), el('span', method.status, 'method-status' + (method.used ? ' used' : '')));
    record.append(summary, explanationContent(method)); $('method-records').append(record);
    if (!method.used || !method.basis || annotations.length >= 3) return;
    const anchor = method.anchors.find(target => targets.has(target.section + ':' + target.index));
    if (!anchor) return;
    const target = targets.get(anchor.section + ':' + anchor.index);
    const container = el('div', null, 'method-callout explain-only'); container.hidden = true;
    const button = el('button', null, 'method-marker'); button.type = 'button';
    button.append(annotationIcon(), el('span', '看方法 · ' + method.name));
    button.setAttribute('aria-expanded', 'false'); button.setAttribute('aria-controls', 'method-detail-' + index);
    const panel = el('section', null, 'method-detail'); panel.id = 'method-detail-' + index; panel.hidden = true;
    panel.setAttribute('aria-label', method.name + '的判断依据');
    const header = el('div', null, 'method-detail-heading'); header.append(el('h4', method.name));
    const close = el('button', '收起', 'method-close'); close.type = 'button'; close.setAttribute('aria-label', '收起' + method.name + '讲解'); header.append(close);
    panel.append(header, explanationContent(method)); container.append(button, panel); target.append(container);
    const annotation = {button, panel, container}; annotations.push(annotation);
    const jump = el('button', method.name, 'explanation-jump'); jump.type = 'button';
    jump.addEventListener('click', () => { if (currentAnnotation !== annotation) openAnnotation(annotation); button.scrollIntoView({block: 'center'}); button.focus({preventScroll: true}); });
    $('explanation-links').append(jump);
    button.addEventListener('click', () => openAnnotation(annotation));
    close.addEventListener('click', () => closeAnnotation(true));
  });
  $('view-mode').hidden = !methods.length;
  function setMode(explaining) {
    closeAnnotation(); document.body.classList.toggle('explaining', explaining);
    $('mode-boss').setAttribute('aria-pressed', String(!explaining));
    $('mode-product').setAttribute('aria-pressed', String(explaining));
    $('methods').hidden = !explaining;
    $('explanation-guide').hidden = !explaining || !annotations.length;
    annotations.forEach(annotation => { annotation.container.hidden = !explaining; });
    if (explaining) toast(annotations.length ? '产品讲解已开启，点击方案中的“看方法”查看判断依据。' : '产品讲解已开启，可在页尾查看每项方法的适用情况。');
  }
  $('mode-boss').addEventListener('click', () => setMode(false));
  $('mode-product').addEventListener('click', () => setMode(true));
  let toastTimer;
  function toast(message) { $('toast').textContent = message; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').textContent = ''; }, 3500); }
  $('copy').addEventListener('click', async () => {
    const money = data.money.label + '：' + number(data.money.value) + (data.money.value === null ? '' : data.money.unit) + '（' + data.money.period + '）';
    const text = [data.merchant.name + '｜经营行动方案', data.merchant.synthetic ? $('synthetic').textContent : '', data.headline, money, data.money.note, '先做：' + first.title, '负责：' + first.owner + '；时间：' + first.timing + '；投入：' + first.budget, '停止条件：' + first.stop, '复盘：' + data.followup.when + '，' + data.followup.decision].filter(Boolean).join('\n');
    $('copy').disabled = true;
    try { if (!navigator.clipboard) throw new Error('Clipboard unavailable'); await navigator.clipboard.writeText(text); toast('摘要已复制'); }
    catch { $('copy-fallback').hidden = false; $('copy-text').value = text; $('copy-text').focus(); $('copy-text').select(); }
    finally { $('copy').disabled = false; }
  });
  $('close-copy').addEventListener('click', () => { $('copy-fallback').hidden = true; $('copy').focus(); });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (!$('copy-fallback').hidden) { $('copy-fallback').hidden = true; $('copy').focus(); }
    else closeAnnotation(true);
  });
  $('print').addEventListener('click', () => window.print());
  let printState = [];
  window.addEventListener('beforeprint', () => { printState = [...document.querySelectorAll('details')].map(node => ({node, open: node.open})); printState.forEach(({node}) => { node.open = true; }); });
  window.addEventListener('afterprint', () => { printState.forEach(({node, open}) => { node.open = open; }); printState = []; });
  if (methods.length && new URLSearchParams(window.location.search).get('view') === 'explain') setMode(true);
})();
</script>
</body>
</html>
